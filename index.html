<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iris Word Challenge</title><style>
:root{font-family:Arial,sans-serif;color:#303748;background:#f5f3f8}*{box-sizing:border-box}body{margin:0;padding:25px 14px}.game{max-width:600px;margin:0 auto;background:white;border-radius:18px;padding:26px;box-shadow:0 8px 30px #30264718;text-align:center}.eyebrow{font-size:12px;letter-spacing:2px;color:#765c98;font-weight:bold}h1{color:#61467e;margin:10px 0}p{line-height:1.5}.hint{background:#f1eaf7;border-radius:10px;padding:13px;margin:16px 0}.drawing{width:190px;height:170px;margin:auto}.drawing line,.drawing circle{stroke:#61467e;stroke-width:4;fill:none;stroke-linecap:round}.word{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:22px 0}.letter{width:30px;border-bottom:3px solid #61467e;height:38px;font-size:26px;font-weight:bold}.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.keys button{width:40px;height:42px;border:0;border-radius:7px;background:#765c98;color:white;font-weight:bold;cursor:pointer}.keys button:disabled{background:#d5d0dc;color:#666;cursor:default}.status{font-weight:bold;min-height:24px}.reset{background:#303748;color:white;border:0;border-radius:9px;padding:12px 20px;cursor:pointer;margin-top:18px}.foot{font-size:12px;color:#74707c;margin-top:22px}@media(max-width:400px){.game{padding:16px}.keys button{width:35px;height:39px}.letter{width:26px}}
</style></head><body><main class="game"><div class="eyebrow">IRIS PEOPLE & CULTURE</div><h1>Word of the Month</h1><p>Guess the mystery word before your six chances run out!</p><div class="hint"><strong>Hint:</strong> <span id="hint"></span></div><svg class="drawing" viewBox="0 0 190 170" aria-label="Hangman drawing"><line x1="15" y1="160" x2="110" y2="160"/><line x1="43" y1="160" x2="43" y2="12"/><line x1="43" y1="12" x2="120" y2="12"/><line x1="120" y1="12" x2="120" y2="30"/><circle class="part" cx="120" cy="46" r="16"/><line class="part" x1="120" y1="62" x2="120" y2="112"/><line class="part" x1="120" y1="76" x2="95" y2="98"/><line class="part" x1="120" y1="76" x2="145" y2="98"/><line class="part" x1="120" y1="112" x2="100" y2="145"/><line class="part" x1="120" y1="112" x2="140" y2="145"/></svg><div class="word" id="word" aria-label="Mystery word"></div><p id="remaining"></p><div class="keys" id="keys"></div><p class="status" id="status" aria-live="polite"></p><button class="reset" id="reset">Play again</button><div class="foot">Made for the Iris team 💜</div></main><script>
// EDIT THESE TWO LINES FOR EACH NEWSLETTER EDITION:
const SECRET_WORD = 'TEAMWORK';
const CLUE = 'What helps every hotel team succeed together?';
const MAX_MISSES=6;let guessed=new Set();let finished=false;
const word=document.getElementById('word'),keys=document.getElementById('keys'),status=document.getElementById('status');document.getElementById('hint').textContent=CLUE;
function render(){const misses=[...guessed].filter(c=>!SECRET_WORD.includes(c)).length;document.querySelectorAll('.part').forEach((p,i)=>p.style.visibility=i<misses?'visible':'hidden');word.innerHTML='';for(const c of SECRET_WORD){const d=document.createElement('span');d.className='letter';d.textContent=guessed.has(c)||finished&&misses===MAX_MISSES?c:'';word.appendChild(d)}document.getElementById('remaining').textContent=`Incorrect guesses: ${misses} of ${MAX_MISSES}`;const won=[...SECRET_WORD].every(c=>guessed.has(c));if(won){finished=true;status.textContent='🎉 Brilliant! You cracked the word!'}else if(misses>=MAX_MISSES){finished=true;status.textContent=`Game over! The word was ${SECRET_WORD}.`}else status.textContent='Choose a letter below.';keys.innerHTML='';for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){const b=document.createElement('button');b.textContent=c;b.disabled=guessed.has(c)||finished;b.setAttribute('aria-label','Guess '+c);b.onclick=()=>{guessed.add(c);render()};keys.appendChild(b)}}document.getElementById('reset').onclick=()=>{guessed=new Set();finished=false;render()};render();
</script></body></html>
